name: Build Development

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: build-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: maven

      - name: Prepare local build dependencies
        run: |
          mkdir -p Common/libs

          curl -fsSL --retry 3 -o Common/libs/xPlayerKits.jar \
            "https://github.com/InsiderAnh/XPlayerKits/releases/download/2.0.5/XPlayerKits.jar"
          curl -fsSL --retry 3 -o Common/libs/TreeCuter.jar \
            "https://github.com/Norbit4/TreeCuter/releases/download/v2.1.0/TreeCuter-v2.1.0.jar"

          cat > "$RUNNER_TEMP/settings.xml" <<'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <profiles>
              <profile>
                <id>extra-repos</id>
                <repositories>
                  <repository>
                    <id>loohpjames</id>
                    <url>https://repo.loohpjames.com/repository/</url>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>extra-repos</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Build
        run: mvn --batch-mode --no-transfer-progress --settings "$RUNNER_TEMP/settings.xml" clean package -DskipTests

      - name: Extract repository name
        run: echo "NAME=$(basename ${{ github.repository }})" >> $GITHUB_ENV

      - name: Upload Build
        uses: marvinpinto/action-automatic-releases@master
        with:
          title: "${{ env.NAME }}"
          automatic_release_tag: "latest"
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          files: "Common/target/StellarProtect.jar"
          prerelease: false
